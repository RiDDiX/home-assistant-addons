---
configuration:
  app_log_level:
    name: Log Level
    description: |
      The log level used for this addon. One of: silly, debug, info, warn, error
  protocol_log_level:
    name: Protocol Log Level
    description: |
      Log level for the matter.js packet logs (MessageChannel, MessageExchange). Only set it to debug when asked for a protocol log, it is very verbose. Default: info
  disable_log_colors:
    name: Disable log colors
    description: |
      Print the log as plain text without any colors.
  mdns_network_interface:
    name: mDNS Network Interface
    description: |
      Limit mDNS to this network interface. Only change it if you know what you are doing. Default: empty
  mdns_strip_global_ipv6:
    name: Strip global IPv6 from mDNS
    description: |
      Drop public (global) IPv6 addresses from the Matter mDNS records so controllers use a locally reachable address. Turn this on if devices show No Response or Offline. Default: off
  heap_size_mb:
    name: Node.js heap limit (MB)
    description: |
      Maximum Node.js heap size. 0 sizes it automatically at half of the free memory, between 256 and 2048 MB. Raise it if a large bridge runs out of memory. Going far above the free memory needs swap to back it. Default: 0
  access_token:
    name: Access token
    description: |
      Long-lived access token of the Home Assistant user the bridge should act as. Empty keeps the Supervisor connection, where actions show up as the user Supervisor. An administrator keeps everything working, a normal user loses the hamh_action event and the vacuum room segment lookup. A wrong token counts as a failed login in Home Assistant. Default: empty
  home_assistant_url:
    name: Home Assistant URL
    description: |
      Address of Home Assistant, only used when an access token is set. Default: http://127.0.0.1:8123
