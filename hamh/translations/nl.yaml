---
configuration:
  app_log_level:
    name: Logniveau
    description: |
      Het logniveau van deze app. Een van: silly, debug, info, warn, error
  disable_log_colors:
    name: Logkleuren uitschakelen
    description: |
      Schrijf het log als platte tekst zonder kleuren.
  mdns_network_interface:
    name: mDNS-netwerkinterface
    description: |
      Beperk mDNS tot deze netwerkinterface. Wijzig dit alleen als je weet wat je doet. Standaard: leeg
  mdns_strip_global_ipv6:
    name: Globale IPv6 uit mDNS weglaten
    description: |
      Verwijder publieke (globale) IPv6-adressen uit de Matter mDNS-records, zodat controllers een lokaal bereikbaar adres gebruiken. Zet dit aan als apparaten 'Geen reactie' of 'Offline' tonen. Standaard: uit
  heap_size_mb:
    name: Node.js-heaplimiet (MB)
    description: |
      Maximale grootte van de Node.js-heap. Bij 0 wordt deze automatisch ingesteld op de helft van het vrije geheugen, tussen 256 en 2048 MB. Verhoog dit als een grote bridge onvoldoende geheugen heeft. Ver boven het vrije geheugen gaan vereist swap als buffer. Standaard: 0
